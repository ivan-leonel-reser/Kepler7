name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-y-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Kepler7.sln -c Release
      - run: dotnet test Kepler7.sln -c Release --no-build
